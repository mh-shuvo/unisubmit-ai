[project]
name = "unisubmit"
version = "10.0.0"
description = "UniSubmit core: web app and validation worker"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.33",
  "itsdangerous>=2.2",            # SessionMiddleware signing
  "pydantic-settings>=2.16",
  "sqlalchemy>=2.1.8",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "httpx>=0.28",
  "pymupdf>=1.25.5,<2",           # 2.x exists: upgrade separately, behind the rule tests
  "reportlab>=4.4",
]

[project.scripts]
unisubmit = "unisubmit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package sits beside pyproject.toml; tests and tooling stay out of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["unisubmit"]
