# Developer use: `uv run alembic -c services/core/alembic.ini revision --autogenerate
# --rev-id 0002 -m "..."`. Deployments run `unisubmit migrate` instead. The
# database URL comes from UNISUBMIT_DATABASE_URL (see migrations/env.py).
[alembic]
script_location = %(here)s/unisubmit/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
