[project]
name = "unisubmit-ai"
version = "10.0.0"
description = "UniSubmit AI service: guideline parsing, RAG indexing and semantic validation"
requires-python = ">=3.13,<3.14"
# Lower bounds are the versions the demo ran on before the move (Python 3.12 venv).
dependencies = [
  "fastapi>=0.143.3",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "python-multipart>=0.0.32",
  "pymupdf>=1.28.2,<2",
  "qdrant-client>=1.19.1",
  "flagembedding>=1.4.2",
  "sentence-transformers>=6.1",
  "torch>=2.14.1",
  "python-dotenv>=1.2.4",
]

# PyPI's Linux torch wheels bundle CUDA (several GB); the AI image and CI only
# need the CPU build. macOS wheels from PyPI already include MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package sits beside pyproject.toml; tests and tooling stay out of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["unisubmit_ai"]
