# Full UniSubmit stack: web app + AI service + Qdrant + Postgres.
#
#   docker compose up -d --build
#
# Ollama runs on the host (Docker on macOS has no GPU access, so host Ollama
# is much faster). Containers reach it via host.docker.internal:11434; set
# DOCKER_OLLAMA_URL in .env (or the shell) to point elsewhere.

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Named volume so it works regardless of Docker Desktop file-sharing
      # settings. Swap for `./storage:/app/storage` to browse uploads on the
      # host (the project path must then be shared with Docker Desktop).
      - app_storage:/app/storage
    environment:
      APP_SECRET: ${APP_SECRET:-change-this-secret-in-production}
      DATABASE_URL: postgresql://unisubmit:unisubmit@db:5432/unisubmit
      AI_SERVICE_URL: http://ai-service:8001
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build: ./ai_service
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-4096}
      OLLAMA_JSON_THINK: ${OLLAMA_JSON_THINK:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unisubmit
      POSTGRES_PASSWORD: unisubmit
      POSTGRES_DB: unisubmit
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unisubmit -d unisubmit"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app_storage:
  pgdata:
  qdrant_storage:
  hf_cache:
