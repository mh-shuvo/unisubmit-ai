name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: unisubmit, POSTGRES_PASSWORD: unisubmit, POSTGRES_DB: unisubmit_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U unisubmit" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://unisubmit:unisubmit@localhost:5432/unisubmit_test
      # For `unisubmit migrate` and `alembic check`, which read the app's settings.
      UNISUBMIT_DATABASE_URL: postgresql+psycopg://unisubmit:unisubmit@localhost:5432/unisubmit_test
      UNISUBMIT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0000
      UNISUBMIT_AI_SERVICE_TOKEN: ci-only-token-not-used-anywhere-else-000000000
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact versions only; there is no floating v10 tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy services/core/unisubmit services/ai/unisubmit_ai
      - run: uv run lint-imports
      - name: Migrations build the schema the models describe
        run: uv run unisubmit migrate && uv run alembic -c services/core/alembic.ini check
      - run: uv run pytest
